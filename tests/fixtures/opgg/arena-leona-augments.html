<!DOCTYPE html><html><head>

<title>Real OP.GG Arena mock for parser tests</title>
<!-- This page is checked in for arena-augment-data-opgg.test.ts.
     It mimics the *shape* OP.GG Arena items emit when their back-end
     has rendered an Augment Leaderboard table. Real OP.GG pages
     dynamically inject equivalent data inside RSC chunks or a JSON
     <script type="application/json"> tag — we don't actually know which.
     The parser MUST look for both and prefer the rich one. -->
</head><body>
<!-- Real OP.GG data would show up either as:
     (a) server-component chunks inlined as <script>self.__next_f.push(...)</script>
     (b) an explicit data island, e.g. <script type="application/json" id="__OPGG_ARENA_AUGMENTS__">
     We hand-write (b) for the fixture so the parser has a single stable target.
     Adding (a) later is purely additive — the parser's first match wins. -->

     parser branch that prefers the rich JSON island remains the right one. -->
